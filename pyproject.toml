[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roboverse-mission"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
markers = [
  "p0: test substrate (fake SDK)",
  "p1: config + frames + UWB control loop",
  "p2: crate map + planner geometry + projection",
  "p3: reactive avoidance guard + plan-then-guard",
  "p4: phase-1 deploy + land in hoop",
  "p5: perception (aruco + detector seam + two-stage)",
  "p6: shared world model (state + taskboard + belief + coordinator)",
  "p7: phase-2 search + lock-on + tag",
  "p8: adversarial evader handling",
  "p9: planner GUI export contract",
  "p10: C2 console",
  "p11: full integration + reliability",
  "r2: phase-2 search/read tuned for the moving gimbal (persistence + search pitch)",
  "integration: requires the REAL sim (run supervised, NOT in the overnight loop)",
]

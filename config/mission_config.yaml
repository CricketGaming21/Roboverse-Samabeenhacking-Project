# mission_config.yaml — mission tunables. Validated on load (reject unknown keys).
# Tags: [SYNC-WITH-SIM] mirror reference/sim/sim_config.yaml · [TO CONFIRM] verify on the day.
meta:
  seed: 42

frame:                       # arena x=North(m), y=East(m); body forward/right/up
  yaw_offset_deg: 0.0        # [TO CONFIRM] body-forward vs arena-+North (calibrate: nudge fwd, watch UWB)
  lock_yaw: true             # hold heading constant so body<->arena is a fixed rotation
  invert_right: false        # [TO CONFIRM] sign of the 'right' stick vs +East
  invert_forward: false      # [TO CONFIRM] sign of the 'forward' stick vs +North

speed:
  max_mps: 0.5               # HARD competition cap — never exceed
  cruise_alt_m: 1.10         # recommended height; NEVER climb to clear an obstacle
  climb_mps: 0.5             # gentle; conservative
  arrive_tol_m: 0.10         # transit arrival tolerance
  ctrl_rate_hz: 20           # send_manual_control cadence (heartbeat-like)
  kp_xy: 0.8                 # placeholder gains — tune on hardware
  ki_xy: 0.0
  kp_alt: 0.8

uwb:
  noise_std_m: 0.05          # expected jitter (smooth/tune gains)
  hold_on_dropout: true      # on (None,None,None): hold position, never lurch
  tag_ids: [0, 1, 2]         # [SYNC-WITH-SIM] one UWB tag per drone

planner:
  arena_truth_file: config/arena_truth.yaml   # crates+arena emitted by the sim (emit_arena_truth); Discord coords play this role on the day
  inflate_m: 0.40            # crate footprint inflation = drone half-width + UWB + overshoot + barrier margin
  separation_min_m: 0.8      # inter-drone lateral separation (horizontal deconfliction)

aruco:
  # [RECONCILED vs sim] dict/pads/ids/speed/camera all match finals/sim sim_config.yaml.
  dictionary: DICT_6X6_250   # [TO CONFIRM on sample pad]
  min_marker_px: 40          # apparent side to count a read
  pad_ids: [10, 11, 12, 13, 14]   # [SYNC-WITH-SIM] pads (validity announced on the day)
  # rover ids are NOT enumerated here on purpose: opponent rovers carry DIFFERENT ids.
  # Rule: any decoded marker whose id is NOT in pad_ids is a rover.

camera:
  width: 640
  height: 480
  h_fov_deg: 71.0            # [TO CONFIRM on the real drone]
  search_gimbal_deg: 60      # forward-tilt for low-altitude search (test 30-60); 90 = straight down
  read_gimbal_deg: 90

pads:                        # [SYNC-WITH-SIM] coords come from Discord on the day; validity announced
  # id, arena (north,east) m, valid flag. designated set is chosen at runtime (pick 3 valid).
  - { id: 10, north: 8.5, east: 3.0, valid: true  }
  - { id: 11, north: 5.5, east: 4.8, valid: true  }
  - { id: 12, north: 2.0, east: 4.5, valid: true  }
  - { id: 13, north: 5.5, east: 1.2, valid: false }
  - { id: 14, north: 2.0, east: 1.5, valid: true  }

landing:
  hoop_tol_m: 0.15           # [TO CONFIRM] measured hoop radius minus UWB margin
  confirm_pad_aruco: true    # decode-to-confirm pad id before committing descent (defensive)

failsafe:
  battery_rtl_pct: 20        # return-and-land threshold (count-first: keep what we have)
  phase1_max_s: 480          # 8-minute cap
  phase2_budget_s: 180       # [TO CONFIRM loiter window]
  lock_timeout_s: 6.0        # time-box a single lock-on attempt, then rotate target

evader:
  secure_autonomous_first: true   # bank the 3 predictable tags before committing to evaders
  contain_with_chokepoints: true

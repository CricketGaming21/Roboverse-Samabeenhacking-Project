# mission_config.yaml — mission tunables. Validated on load (reject unknown keys).
# Tags: [SYNC-WITH-SIM] mirror reference/sim/sim_config.yaml · [TO CONFIRM] verify on the day.
meta:
  seed: 42

frame:                       # arena x=North(m), y=East(m); body forward/right/up
  yaw_offset_deg: 0.0        # [TO CONFIRM] body-forward vs arena-+North (calibrate: nudge fwd, watch UWB)
  lock_yaw: true             # hold heading constant so body<->arena is a fixed rotation
  invert_right: false        # [TO CONFIRM] sign of the 'right' stick vs +East
  invert_forward: false      # [TO CONFIRM] sign of the 'forward' stick vs +North

speed:
  max_mps: 0.5               # HARD competition cap — never exceed
  cruise_alt_m: 1.10         # recommended height; NEVER climb to clear an obstacle
  climb_mps: 0.5             # gentle; conservative
  arrive_tol_m: 0.10         # transit arrival tolerance
  ctrl_rate_hz: 20           # send_manual_control cadence (heartbeat-like)
  kp_xy: 0.8                 # placeholder gains — tune on hardware
  ki_xy: 0.0
  kp_alt: 0.8

uwb:
  noise_std_m: 0.05          # expected jitter (smooth/tune gains)
  hold_on_dropout: true      # on (None,None,None): hold position, never lurch
  tag_ids: [0, 1, 2]         # [SYNC-WITH-SIM] one UWB tag per drone

drones:                      # [SYNC-WITH-SIM] mirrors sim drones.units: control IP <-> UWB tag <-> arena start (north,east) m.
  # Discovery resolves IP<->tag from THIS (the sim's Dola raises NotImplementedError); Dola is opt-in for the real day.
  - { ip: "10.0.0.11", tag_id: 0, start: [0.6, 1.1] }
  - { ip: "10.0.0.12", tag_id: 1, start: [0.6, 0.6] }
  - { ip: "10.0.0.13", tag_id: 2, start: [1.1, 0.6] }

planner:
  arena_truth_file: config/arena_truth.yaml   # crates+arena emitted by the sim (emit_arena_truth); Discord coords play this role on the day
  inflate_m: 0.40            # crate footprint inflation = drone half-width + UWB + overshoot + barrier margin
  separation_min_m: 0.8      # inter-drone lateral separation (horizontal deconfliction)
  pad_approach_inflate_m: 0.20   # reduced margin for a pad hard against a thin arch post (sim pad 11
                             # sits 0.4 m from a post): final approach/departure stays raw-clear, no overfly

aruco:
  # [SYNC-WITH-SIM] the sim now mirrors the REAL event exactly (DICT_7X7_1000 + real ids).
  # Detection is an ALLOW-LIST: bank only ids in rover_ids.
  dictionary: DICT_7X7_1000  # real-event dictionary (matches real flight)
  min_marker_px: 40          # apparent side to count a read
  rover_ids: [11, 45, 51, 67, 101]   # autonomous 11/45/51 + evasive 67/101 (pads carry NO marker)

camera:
  width: 640
  height: 480
  h_fov_deg: 71.0            # [TO CONFIRM on the real drone]
  search_gimbal_deg: 60      # legacy (unused) — superseded by search_pitch_deg
  read_gimbal_deg: 90        # legacy (unused) — R2 reads at the same moderate pitch, NOT nadir
  search_pitch_deg: 52       # R2: moderate forward tilt held for search AND read (0=fwd, 90=nadir).
                             # Do NOT steepen to nadir — the gimbal marker faces any yaw; a side
                             # marker is lost at nadir. Offset + this tilt keeps it in the cone.
  use_nadir_search: false    # baseline fallback: set true to search/read straight down (90°)
  video_warmup_timeout_s: 15.0   # wait up to this long for the first frame after stream-on
                                 # (real H.264 negotiation; no-op on sim) before Phase-2 detection

search:                      # R2 persistence on a seen-but-unread (out-of-cone) rover
  persist_timeout_s: 9.0     # hold past one full gimbal sweep (~8 s @ 45°/s) before a light orbit
  orbit_step_m: 0.6          # light lateral strafe to change bearing (≤ cruise; lateral, no overfly)
  max_orbits: 2              # orbit attempts before releasing a stubborn target
  presence_min_area_px: 500  # min rover-body blob area (px) to treat as a presence to persist on

pads:                        # [SYNC-WITH-SIM] these are the SIM's landing zones (mirror the sim's
  # sim_config.yaml landing_zones / arena_truth.yaml). They are SIM coords for sim testing ONLY.
  # The REAL-day pad coords come from Discord and live in config/mission_real.yaml — do NOT copy
  # these sim coords there. id, arena (north,east) m. Part-1 scores only valid AND designated pads.
  - { id: 11,  north: 4.40, east: 1.35, valid: true,  designated: true  }   # sim "Land"
  - { id: 45,  north: 7.85, east: 1.30, valid: true,  designated: true  }   # sim "Land"
  - { id: 51,  north: 4.40, east: 4.40, valid: true,  designated: true  }   # sim "Land"
  - { id: 67,  north: 8.70, east: 1.95, valid: false, designated: false }   # sim INVALID zone
  - { id: 101, north: 7.85, east: 4.40, valid: false, designated: false }   # sim INVALID zone

landing:
  hoop_tol_m: 0.15           # [TO CONFIRM] measured hoop radius minus UWB margin
  # R1: Phase-1 lands on UWB ONLY — the real pads carry no ArUco, so there is no decode/confirm.

failsafe:
  battery_rtl_pct: 20        # return-and-land threshold (count-first: keep what we have)
  phase1_max_s: 480          # 8-minute cap
  phase2_budget_s: 180       # [TO CONFIRM loiter window]
  lock_timeout_s: 6.0        # time-box a single lock-on attempt, then rotate target

evader:
  secure_autonomous_first: true   # bank the 3 predictable tags before committing to evaders
  contain_with_chokepoints: true

real:                        # real-hardware init only — NO-OP on the sim (its DroneAPI lacks
  # these methods, so sdk_compat's hasattr guards skip them). Tunable here so the real day needs
  # no code change. On the sim these values are read but never reach a SDK call.
  heartbeat_hz: 10           # send_app_heartbeat keep-alive rate while manual control is active
  velocity_level: MEDIUM     # firmware speed band for the 0.5 m/s HARD cap (MEDIUM = usable max)

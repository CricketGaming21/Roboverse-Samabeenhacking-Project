# =============================================================================
# sim_config.yaml — Hula Swarm Simulator
# Overrides the defaults in sim/config.py. Point $HULA_SIM_CONFIG here, or keep
# this file in the repo root. Units: metres, degrees, cm only where noted.
# Coordinate frame (arena / UWB):  x = NORTH (m),  y = EAST (m),  z = UP (m).
# NOTE: dimensions, pad coordinates, and marker IDs are PLACEHOLDERS — confirm
# against the real arena/briefing on the day; the code reads everything here.
# =============================================================================

meta:
  seed: 42                 # one seed drives arena gen, rover paths, noise, drift
  real_time_factor: 1.0    # 1.0 = real time; >1 runs faster for quick tests

# --- Two-phase episode: DEPLOY (land) -> AMBUSH (convoy) -> DONE --------------
# The ambush trigger is SCENARIO-owned (the organisers launch the convoy on the
# real day) — mission code can never start it; there is no pyhulax API for it.
scenario:
  phases: both             # deploy | ambush | both
  episode_seconds: 180     # total run length (sim time)
  deploy_timeout_s: 90     # max time allowed for part 1; then AMBUSH is forced
  ambush_seconds: 120      # how long the convoy phase runs
  entrance: [0.5, 0.5]     # arena (north,east): drones launch / convoy enters
  ambush_trigger:
    mode: on_all_landed    # on_all_landed (ground truth + delay) | timed
                           # (delay_s after episode start) | manual_key
                           # (press 'a' in --live)
    delay_s: 3.0           # extra delay after the trigger event fires

# --- Arena: a rectangular room -----------------------------------------------
arena:
  shape: rectangle
  layout: authored         # authored (fixed map matching the reference images, DEFAULT)
                           # | procedural (seeded random — robustness mode, kept working)
  length_m: 10.0           # extent along NORTH (x)
  width_m: 6.0             # extent along EAST  (y)
  height_m: 3.0            # ceiling
  wall_thickness_m: 0.1
  origin: [0.0, 0.0, 0.0]  # where the arena/UWB origin sits in pybullet world
  yaw_deg: 0.0             # arena->world rotation (0 = aligned)
  # --- authored layout (layout: authored) — APPROXIMATE coords, adjust freely.
  # north = image bottom->top, east = image left->right; entrance is SW (~0.5, 0.5).
  authored:
    crate_m: 0.45          # crate footprint side; cluster boxes touch like stacked crates
    clusters:              # crate clusters at image positions; heights vary [min, max]
      - { center: [5.0, 3.0], boxes: 5, height_m: [0.4, 1.2] }   # central plus of crates
      - { center: [7.5, 4.2], boxes: 2, height_m: [0.6, 1.0] }   # upper-right pair
      - { center: [4.6, 5.4], boxes: 2, height_m: [0.4, 0.9] }   # right-edge pair
      - { center: [3.0, 3.5], boxes: 2, height_m: [0.5, 1.1] }   # lower-centre pair
    archway: { corner: [9.0, 5.0], width_m: 1.0, height_m: 1.2 } # tunnel in the NE corner
  # --- procedural layout (layout: procedural) — the seeded random generator ---
  obstacles:
    count: 8
    footprint_min_m: 0.3   # box/pillar footprint side
    footprint_max_m: 0.8
    height_min_m: 0.5
    height_max_m: 2.2      # some taller than flight altitude -> must be avoided
    min_clearance_m: 0.8   # gap between obstacles
    keepclear_radius_m: 1.0  # no obstacles within this radius of pads/drone starts

# --- Speed mapping for VelocityLevel -----------------------------------------
# NOTE: the pyhulax VelocityLevel enum value is a position-controller P-GAIN
# (SLOW=300, MEDIUM, ZOOM=100, TURBO=50 — LOWER int = FASTER), NOT a speed.
# These are the SIM's real-world speeds per level (TURBO fastest). The sim maps
# by level NAME via this table; it must never treat the enum int as a speed.
# CONFIRMED (HG-F09 manual): programming-mode speed band is 0.5-1.0 m/s.
velocity_levels:           # m/s per pyhulax speed level, capped at 1.0
  SLOW: 0.3                # below the band, for gentle moves
  MEDIUM: 0.5
  ZOOM: 0.8                # pyhulax default level
  TURBO: 1.0               # the real cap
  yaw_rate_dps: 60.0       # rotate() angular speed
  climb_mps: 1.2           # confirmed asymmetric vertical: climb 1.2 m/s
  descent_mps: 1.0         #                                descend 1.0 m/s

# --- Airframe motion realism ---------------------------------------------------
# Models BEHAVIOUR (ramps, momentum, settling, latency, bounded drift) — NOT a
# firmware-accurate dynamics replica (the Hula has no SITL). realistic: false
# restores crisp snap-to-target motion for deterministic geometry tests.
motion:
  realistic: true
  max_tilt_deg: 20.0       # confirmed max BODY tilt (tilt-to-translate)
  accel_mps2: 1.2          # accel/decel ramp to/from cruise speed
  latency_s: 0.08          # command-to-motion latency
  overshoot_frac: 0.15     # under-braking => mild overshoot then settle
  arrive_tol_m: 0.04       # settled-position tolerance
  arrive_speed_mps: 0.08   # ...and residual-speed tolerance
  wind_mps: 0.0            # optional gentle wind disturbance (0 = off)
  manual_timeout_s: 1.0    # send_manual_control frames older than this
                           # (sim s) read as zero input (coast + hold)

# --- Drones (3) --------------------------------------------------------------
# start positions in arena frame (north, east); heading_deg 0 = facing +north.
drones:
  takeoff_height_cm: 100
  battery:
    start_pct: 100
    drain_pct_per_min: 10.0  # confirmed ~9-10 min flight time
    low_threshold_pct: 10  # below this, motion commands raise LowBattery
  units:                   # one entry per drone (list under a key — valid YAML)
    # Clustered at the SW entrance (the same spot the convoy enters), ~0.5 m
    # apart, so they fan out from there to their pads.
    - { ip: "10.0.0.11", uwb_tag_id: 0, start: [0.6, 1.1], heading_deg: 0.0 }
    - { ip: "10.0.0.12", uwb_tag_id: 1, start: [0.6, 0.6], heading_deg: 0.0 }
    - { ip: "10.0.0.13", uwb_tag_id: 2, start: [1.1, 0.6], heading_deg: 0.0 }

# --- UWB tag (matches UWBParserThread + its doc) -----------------------------
uwb:
  rate_hz: 10.0            # sample refresh rate (sim time); value held between refreshes
  noise_std_m: 0.05        # Gaussian noise on x,y (truth + noise; NO drift)
  dropout_prob: 0.0        # 0 = never; >0 = mapped tag occasionally returns (None,None,None)
  apply_origin_offset: false  # real code accepts x_origin/y_origin but does NOT apply them
  x_origin: 0.0            # only used if apply_origin_offset: true
  y_origin: 0.0

# --- Onboard position estimate drift (get_position only; UWB never drifts) ----
# Mean-reverting (OU), calibrated to the confirmed optical-flow accuracy:
# wanders to ~±bound and stays BOUNDED there — never unbounded.
position_drift:
  enabled: true
  horizontal_bound_m: 0.20 # confirmed ±20 cm horizontal (~2 sigma)
  vertical_bound_m: 0.10   # confirmed ±10 cm vertical
  tau_s: 20.0              # mean-reversion time constant

# --- Barrier sensors (IR/ToF, blocked/clear per direction) -------------------
barrier_sensors:
  range_m:                 # ray length that counts as "blocked"
    forward: 0.6
    back: 0.6
    left: 0.6
    right: 0.6
    down: 0.4
  min_altitude_m: 0.35     # below this, barriers report clear (like the real sensors)

# --- Camera (tiltable front/down, monocular RGB) -----------------------------
# 640x480 is the Hula's LOW / "AI mode" resolution — the default for detection.
# 1280x720 / 1920x1080 extend ArUco range (~3.4 m / ~5.0 m for the 0.15 m
# marker at the 40 px gate, vs ~1.7 m at 640) at higher latency.
camera:
  width: 640
  height: 480
  h_fov_deg: 71.0          # CONFIRMED (manual); verify once on the real drone
  near_m: 0.05
  far_m: 25.0
  default_pitch_deg: 0.0   # 0 = forward, 90 = straight down (set_camera_angle)
  fps: 30

# --- ArUco -------------------------------------------------------------------
aruco:
  dictionary: DICT_6X6_250  # matches the organiser ArUco sample (Potential Detection Targets); supports ids 0-249; confirm at briefing
  pad_marker_size_m: 0.30  # printed marker side on landing pads
  rover_marker_size_m: 0.15  # marker side on top of each rover

# --- Landing pads (GIVEN coordinates; placeholders until provided) -----------
# Each pad: ArUco id + arena position (north, east) + scoring flags.
# valid: a legal landing zone (false = decoy/red marker). designated: one of
# the briefed "Land" targets this episode (part-1 scoring needs valid AND
# designated). ~5 pads, 3 designated — matches the reference image.
pads:
  - { id: 10, north: 8.5, east: 3.0, valid: true,  designated: true }   # top "Land"
  - { id: 11, north: 5.5, east: 4.8, valid: true,  designated: true }   # right "Land"
  - { id: 12, north: 2.0, east: 4.5, valid: true,  designated: true }   # bottom-right "Land"
  - { id: 13, north: 5.5, east: 1.2, valid: false, designated: false }  # left-mid INVALID
  - { id: 14, north: 2.0, east: 1.5, valid: true,  designated: false }  # valid, not designated

# --- Rovers (5, moving targets, each a unique ArUco id on top) ---------------
rovers:
  count: 5
  marker_ids: [20, 21, 22, 23, 24]   # must be distinct and != pad ids
  billboard_texture: assets/robomaster.png  # visual realism (detection uses the marker)
  motion: convoy           # convoy (fixed scenario routes, DEFAULT)
                           # | patrol (random waypoints — back-compat flag)
  # Convoy (matches the Phase-2 image): enter from scenario.entrance (SW)
  # staggered, run the shared trunk, split to per-rover winding branches,
  # then loiter. FIXED routes only — no evasion, no reacting to drones.
  # Routes are AUTHORED to thread between the crate clusters; the phase-11
  # test rejects any waypoint that clips a footprint (then nudge it here).
  convoy:
    entry_stagger_s: 2.0   # gap between successive rovers entering
    speed_mps: 0.4
    trunk: [[1.0, 0.8], [2.5, 1.5], [4.0, 2.0]]  # shared path from the entrance
    split_index: 2         # after this trunk waypoint each rover branches
    # Long WINDING LOOPS traced from the reference image (loiter=loop cycles
    # them) — not straight hops. Threaded between the crates / through the
    # arch; the phase-11 full-path clearance test rejects a clipping edit.
    branches:              # one per rover
      - [[5.0, 1.2], [6.5, 0.9], [8.0, 1.2], [8.6, 2.2], [7.5, 2.6],
         [6.0, 2.2], [5.0, 1.8]]                 # south-west loop
      - [[5.6, 2.2], [7.0, 2.6], [8.2, 3.4], [8.6, 2.6], [7.4, 2.0],
         [6.3, 1.6]]                             # centre loop, east of the plus
      - [[4.0, 4.3], [5.8, 4.6], [7.0, 5.2], [8.5, 5.2], [9.4, 5.05],
         [9.4, 3.7], [8.6, 3.6], [7.0, 3.7], [6.2, 4.5]]  # east loop, thru the arch
      - [[4.0, 4.0], [3.2, 4.8], [2.2, 5.2], [1.5, 4.3], [2.4, 3.9],
         [3.2, 4.2]]                             # north-west loop via the gap
      - [[5.5, 2.4], [7.0, 2.1], [8.4, 2.4], [9.4, 3.2], [9.4, 4.0]]  # north lane loop
    loiter: loop           # loop the branch | hold at the end
  patrol:
    mode: waypoint_random            # random waypoints within bounds
    speed_mps: 0.4
    waypoint_pause_s: 1.0
    bounds_north: [1.0, 9.0]         # keep rovers off the walls
    bounds_east: [1.0, 5.0]

# --- Scoring (two referees, sim-side) ----------------------------------------
# Part 1 (DEPLOY): landing accuracy. Part 2 (AMBUSH): rover snapshots only —
# pads never count as part-2 targets.
scoring:
  mode: auto               # auto = sustained-visibility; explicit = deliberate-capture hook
  min_marker_px: 40        # apparent marker side must be >= this (close/clear enough)
  frame_margin_px: 8       # marker must sit this far inside the frame edges
  hold_frames: 5           # consecutive frames the same drone must hold a valid read
  landing:                 # part-1 referee (landings during DEPLOY)
    tolerance_m: 0.30      # touchdown within this of a designated pad centre
    assignment: nearest_unclaimed   # nearest_unclaimed | fixed (drones.units[].pad_id)
    time_weighted: true    # report/weight by time-to-land

# --- Top-down live view ------------------------------------------------------
viz:
  enabled: true            # set false for headless/batch/CI
  fps: 15
  show_camera_windows: false  # debug: also cv2.imshow each drone's frame
  show_camera_fov: true    # draw each drone's camera footprint (top-down + 3D).
                           # The footprint TILTS with set_camera_angle (pitch);
                           # its angular size is FIXED by the lens — no zoom.
  show_proximity: true     # car-sensor obstacle display per drone — OBSERVER
                           # ONLY (sim ground truth); the mission still gets
                           # just the blocked/clear booleans from get_obstacles


# --- Command-rate / thrash monitor -------------------------------------------
monitor:
  max_cmd_rate_hz: 5.0     # warn if a drone is re-commanded faster than this
  warn_on_preempt: true    # warn if a new motion command preempts an unfinished one

# --- Logging -----------------------------------------------------------------
logging:
  level: INFO
  file: logs/sim.log
